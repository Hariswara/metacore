[project]
name = "metacore-module1"
version = "0.0.0"
description = "Module 1 — Multi-Modal Spatiotemporal State Representation (Zayan, IT23248212)"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.66",
  "pydantic>=2.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "xarray>=2024.9",
  "rasterio>=1.4",
]

# The deep-learning stack is an extra, not a base dependency. Everything that is not model
# training or inference -- the calibration stages, the contracts, the service scaffolding -- runs
# without it, and pulling ~2 GB of wheels to run a reconciliation gate is a poor trade. Install it
# when you need it:  uv sync --all-packages --all-extras
[project.optional-dependencies]
models = [
  "torch>=2.4",
  "torch-geometric>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/module1"]
