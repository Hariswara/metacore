[project]
name = "metacore-module1"
version = "0.0.0"
description = "Module 1 — Multi-Modal Spatiotemporal State Representation (Zayan, IT23248212)"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.66",
  "pydantic>=2.9",
  "torch>=2.4",
  "torch-geometric>=2.6",
  "numpy>=2.0",
  "pandas>=2.2",
  "xarray>=2024.9",
  "rasterio>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/module1"]
