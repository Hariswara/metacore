# Module 3 - Cost-Aware Metacognitive Gating - starter config
seed: 0
k_classes: 3
m2_stream_path: null   # null → ../module2_auq_engine/sample_m2_to_m3.jsonl

env:
  episode_len: 80
  budget_per_episode: 45   # covers severe+extreme value-axis steps after calm stages

scenario:
  hazard_onset_step_frac: 0.55
  lead_time_at_start_min: 30.0

reward:
  deliberation_cost: 0.10
  benefit_scale: 4.0
  needless_escalation_penalty: -0.8   # negative: escalating when calm + sure
  sensing_escalation_penalty: -1.2    # negative: deliberating on missing data
  missed_escalation_penalty: 2.5      # positive weight; applied as -penalty (value/both only)
  reject_penalty: 1.5
  trigger_threshold: 0.40             # u below this + low severity ⇒ needless

train:
  episodes: 150
  lr: 0.004
  baseline_momentum: 0.9
  batch_episodes: 5                   # REINFORCE updates every N episodes

eval:
  n_episodes: 12
