[project]
name = "metacore-module3"
version = "0.0.0"
description = "Module 3 — Cost-Aware Metacognitive Gating & Meta-Policy, training only (Saabir, IT23432598)"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.66",
  "pydantic>=2.9",
  "torch>=2.4",
  "gymnasium>=1.0",
  "onnx>=1.17",
  "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/module3"]
