[project]
name = "metacore-module2"
version = "0.0.0"
description = "Module 2 — Agentic Epistemic Uncertainty Quantification (Duwaragie, IT23270442)"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.66",
  "pydantic>=2.9",
  "torch>=2.4",
  "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/module2"]
