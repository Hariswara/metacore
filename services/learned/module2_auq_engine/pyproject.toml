[project]
name = "metacore-module2"
version = "0.0.0"
description = "Module 2 — Agentic Epistemic Uncertainty Quantification (Duwaragie, IT23270442)"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.66",
  "pydantic>=2.9",
  # Pinned to a minor version, not >=2.4. Training here is seeded and bit-reproducible
  # in-process, but the reported metrics still moved between environments because the
  # torch version moved with them -- a floating major dependency is the reproducibility
  # bug, not the seeding. Raise this deliberately and re-run run_demo.py when you do.
  "torch>=2.11,<2.12",
  "numpy>=2.0",
]

# Plotting only. The metrics themselves are NumPy and are computed and asserted without
# it, so the test lane never installs a plotting stack:
#   uv sync --package metacore-module2 --extra viz
[project.optional-dependencies]
viz = ["matplotlib>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/module2"]
