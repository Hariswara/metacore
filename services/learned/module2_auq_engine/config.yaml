# Module 2 - AUQ Engine - starter config
seed: 0
k_classes: 3
class_names: [safe, stressed, critical]
# Features come from the pinned contract (metacore_contracts.state_schema.FEATURE_NAMES),
# not from this file -- 28 names, fixed order. Listed nowhere here so the two cannot diverge.
train:
  epochs: 300
  batch_size: 128
  lr: 0.002
  weight_decay: 0.00001
  kl_anneal_epochs: 50      # slow anneal of the Dirichlet KL term
  ood_reg_weight: 0.1       # OOD-aware evidence regularisation
  ood_proxy_sigma: 4.0      # spread of the far-OOD proxy (standardised space)
trigger:
  # Two conditions, OR'd. The value threshold is the (1 - far) quantile of plain,
  # quality-independent in-distribution u; the floor keys off M1's nominal
  # observed_fraction, so ordinary interpolated data does not fire but a lost
  # modality does.
  value_false_alarm_rate: 0.05
  observed_fraction_floor: 0.4
  hysteresis: 2             # consecutive steps to confirm / clear a competence drop
