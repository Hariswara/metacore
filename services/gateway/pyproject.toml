[project]
name = "metacore-gateway"
version = "0.0.0"
description = "FastAPI gateway — the single external API surface"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.66",
  "pydantic>=2.9",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
