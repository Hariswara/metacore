# DETERMINISTIC CORE — see docs/adr/0003-deterministic-core-isolation.md
# No ML dependency may be added here. infra/ci/check_core_purity.sh fails the build
# if one appears, and the same check runs as a pre-commit hook.
[project]
name = "metacore-module4-translation"
version = "0.0.0"
description = "Module 4 — abductive semantic translation, downstream of the verdict (Hariswara, IT23291782)."
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.66",
  "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/translation"]
