name: frontend

on:
  push:
    paths: ["apps/**", "packages/ts_common/**", "pnpm-workspace.yaml", ".github/workflows/frontend.yml"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm -r lint
      - run: pnpm --filter @metacore/dashboard build
