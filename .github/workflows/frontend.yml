name: frontend

on:
  push:
    paths: ["apps/**", "packages/ts_common/**", "pnpm-workspace.yaml", ".github/workflows/frontend.yml"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile=false
      # --if-present: no workspace package declares a linter yet. A bare `pnpm -r lint` exits 1
      # with ERR_PNPM_RECURSIVE_RUN_NO_SCRIPT in that case, which reads as a lint failure rather
      # than as an absence of lint. This form turns the lane on by itself the moment a package
      # adds the script, without anyone remembering to edit this file.
      - run: pnpm -r --if-present lint
      # `build` is `tsc -b && vite build`, so this is the lane's real check: the dashboard is a
      # stub, and type-checking it is what currently catches a broken contract stub or import.
      - run: pnpm --filter @metacore/dashboard build
