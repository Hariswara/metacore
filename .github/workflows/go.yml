name: go

on:
  push:
    paths: ["services/realtime/**", "packages/go_common/**", "go.work", ".github/workflows/go.yml"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: go work sync
      - run: go vet ./...
      - run: go test ./...
