name: python

on:
  push:
    paths: ["services/**", "packages/**", "pyproject.toml", ".github/workflows/python.yml"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install uv
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run pytest services packages
