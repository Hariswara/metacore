name: python

on:
  push:
    paths: ["services/**", "packages/**", "pyproject.toml", ".github/workflows/python.yml"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install uv
      # --all-groups: `--all-packages` syncs the workspace members but not the root's
      # `dev` dependency-group, so ruff and pytest were never installed and the lane died on
      # `Failed to spawn: ruff` the moment anything upstream of it stopped failing first.
      - run: uv sync --all-packages --all-groups
      # --no-sync: a bare `uv run` reshapes .venv to match its own flags, which drops the groups
      # the sync above just installed.
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest services packages
