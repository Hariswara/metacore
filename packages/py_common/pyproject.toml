[project]
name = "metacore-py-common"
version = "0.0.0"
description = "Shared Python utilities — logging, config, telemetry, typing"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9", "structlog>=24.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
