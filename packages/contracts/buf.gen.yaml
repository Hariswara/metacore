version: v2
managed:
  enabled: true
plugins:
  # Pinned to the versions the committed stubs were generated with: an unpinned remote plugin
  # emits gencode newer than the locked protobuf runtime (7.35.1), which refuses to import it.
  - remote: buf.build/protocolbuffers/python:v35.1
    out: python/metacore_contracts
  - remote: buf.build/grpc/python
    out: python/metacore_contracts
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: go
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: go
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.14.0
    out: ts/src
