[project]
name = "metacore-contracts"
version = "0.0.0"
description = "Generated Python stubs from packages/contracts/proto — do not hand-edit"
requires-python = ">=3.11"
dependencies = ["protobuf>=5.28", "grpcio>=1.66"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metacore_contracts"]
